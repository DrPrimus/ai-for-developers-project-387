config-secrets:
  - OPENCODE_API_KEY
  - HEXLET_ID

ignores:
  - rule: dangerous-triggers
    file: .github/workflows/opencode.yml
    reason: >-
      issue_comment and pull_request_review_comment are the required triggers.
      Only OWNER, MEMBER and COLLABORATOR comments start the job, and the
      OpenCode GitHub Action additionally checks admin/write permission itself.
      The job GITHUB_TOKEN has no write scopes; write access comes only from the
      short-lived OpenCode GitHub App token obtained through OIDC. The agent
      runs with the action's default build tools. Checkout uses
      persist-credentials: false, and runs are serialized per issue or PR with a
      15 minute timeout.
    expires: "2027-05-31"
