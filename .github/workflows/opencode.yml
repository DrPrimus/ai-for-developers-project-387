name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

concurrency:
  # Serialize runs for one issue or pull request: a newer /oc comment waits for
  # the run that is already in progress instead of racing it.
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/oc ') ||
       startsWith(github.event.comment.body, '/opencode ')) &&
      (github.event_name == 'pull_request_review_comment' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request == null))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Exchange an OIDC token for a short-lived OpenCode GitHub App token.
      # The App token supplies the write access (comments, commits, pull requests).
      id-token: write
    steps:
      - name: Checkout repository
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Start from trusted code. For pull request review comments the CLI
          # checks out the pull request branch itself.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        # github-v1.2.28, the last release of the GitHub Action.
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # OpenCode 1 (installed by this action) ignores the action's "agent"
          # input and expects "permission", not the OpenCode 2 "permissions"
          # array. Read-only tools stay available, edits are allowed, and
          # bash/grep/webfetch/task plus .git/** are denied so the App token
          # that the CLI keeps in .git/config during the run cannot be read.
          OPENCODE_CONFIG_CONTENT: |
            {"default_agent":"build","permission":{"*":"deny","read":{"*":"allow",".git/**":"deny"},"glob":"allow","list":"allow","edit":{"*":"allow",".git/**":"deny"},"grep":"deny","bash":"deny","task":"deny","webfetch":"deny","websearch":"deny","external_directory":"deny"}}
        with:
          model: opencode/deepseek-v4.1-flash
